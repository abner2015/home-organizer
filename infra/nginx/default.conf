upstream api_upstream { server api:8000; }

server {
  listen 80;
  client_max_body_size 20m;     # Phase 3: max single-image size

  # API
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # MinIO dev proxy — the browser can fetch pre-signed URLs straight from
  # MinIO via port 9000, but in dev we expose it under /minio/ for convenience.
  location /minio/ {
    rewrite ^/minio/(.*) /$1 break;
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;
  }
}
